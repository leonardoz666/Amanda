<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Amanda</title>
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Para Amanda">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="ui/Botao.png">
    <link rel="apple-touch-icon" href="ui/Botao.png">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css?v=6" />
    <script src="index.js?v=6"></script>
    <style>
        body {
            cursor: url('ui/pink.cur'), auto;
            background: transparent;
        }

        /* Aplica a todos os elementos clicáveis */
        button,
        input,
        a,
        [onclick],
        .clickable {
            cursor: url('ui/pink2.cur'), pointer !important;
        }

        /* Elementos do panda */
        .panda-face,
        .hand-l,
        .hand-r {
            cursor: url('ui/pink2.cur'), grab !important;
        }

        .card {
            cursor: url('ui/pink2.cur'), pointer !important;
        }

        /* Adicionar regra para imagens clicáveis */
        img[src*=".png"],
        img[src*=".jpg"] {
            cursor: url('ui/pink2.cur'), pointer !important;
        }

        .memory-card {
            cursor: url('ui/pink2.cur'), pointer !important;
            background: transparent !important;
        }

        .memory-card > div:first-child,
        .memory-card-front {
            background: url('ui/carta_verso.png') center / cover no-repeat !important;
            background-color: transparent !important;
        }

        .memory-card > div:first-child > div,
        .memory-card-front > div {
            display: none !important;
        }

        /* Botão JORNAL - Estilo Vermelho e Preto dos Cards */
        #jornalButton {
            background: linear-gradient(135deg, #b8141b, #4a0408) !important;
            border: 2px solid #8b0000 !important;
            box-shadow: 0 8px 0 #2b0204 !important;
            filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 16px rgba(196, 21, 28, 0.7)) !important;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9) !important;
        }

        #jornalButton:hover {
            filter: drop-shadow(0 12px 16px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 24px rgba(255, 30, 45, 0.95)) !important;
        }

        /* Aura Vermelha e Preta da Karen */
        #karenCharacter {
            filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 16px rgba(196, 21, 28, 0.65)) !important;
        }

        #karenCharacter:hover {
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 30px rgba(255, 30, 45, 0.95)) !important;
        }

        /* Forçar cursor em todos os estados do input */
        input[type="text"],
        input[type="password"] {
            cursor: url('ui/pink2.cur'), text !important;
            color: #000000 !important;
        }

        input[type="text"]:active,
        input[type="password"]:active,
        input[type="text"]:focus,
        input[type="password"]:focus {
            cursor: url('ui/pink2.cur'), text !important;
        }

        /* Labels dos inputs */
        form label {
            cursor: url('ui/pink2.cur'), text !important;
            color: #000000 !important;
        }

        /* Inputs em todos os estados */
        input[type="text"],
        input[type="password"],
        input[type="text"]:hover,
        input[type="password"]:hover,
        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="text"]:active,
        input[type="password"]:active {
            cursor: url('ui/pink2.cur'), text !important;
        }

        /* Estado de seleção de texto */
        input[type="text"]::selection,
        input[type="password"]::selection {
            cursor: url('ui/pink2.cur'), text !important;
        }
    </style>
</head>

<body>
    <!-- Container Principal -->
    <div class="container">
    </div>

</body>

<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("./sw.js").then((reg) => {
                reg.update();
            }).catch((error) => {
                console.error("Falha ao registrar service worker:", error);
            });
        });
    }
</script>

</html>
