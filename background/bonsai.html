<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonsai Background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #010113;
    }
    .bonsai-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #010113;
    }
    .bonsai-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      animation: bonsaiBreathe 14s ease-in-out infinite alternate;
      will-change: transform, filter;
      filter: brightness(0.94) contrast(1.06);
    }
    @keyframes bonsaiBreathe {
      0% {
        transform: scale(1) translateY(0);
        filter: brightness(0.92) contrast(1.05);
      }
      50% {
        filter: brightness(1.02) contrast(1.08);
      }
      100% {
        transform: scale(1.03) translateY(-6px);
        filter: brightness(0.97) contrast(1.06);
      }
    }
    .ambient-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 62% 42%, rgba(255, 182, 193, 0.14) 0%, rgba(135, 206, 250, 0.08) 35%, transparent 70%),
                  radial-gradient(circle at 22% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 50% 50%, transparent 50%, rgba(0, 0, 0, 0.45) 100%);
      animation: glowPulse 8s ease-in-out infinite alternate;
    }
    @keyframes glowPulse {
      0% { opacity: 0.65; }
      100% { opacity: 1; }
    }
    canvas#bonsaiCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="bonsai-container">
    <img src="bonsai.jpg" alt="Bonsai" class="bonsai-image" id="bonsaiImg" />
    <div class="ambient-glow"></div>
    <canvas id="bonsaiCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('bonsaiCanvas');
    const ctx = canvas.getContext('2d');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // ===================== PÉTALAS / FOLHAS =====================
    const PETAL_COUNT = 48;
    const petals = [];

    class Petal {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        this.x = Math.random() * (width + 200) - 100;
        this.y = initial ? Math.random() * height : -30;
        this.size = Math.random() * 8 + 9;
        this.speedY = Math.random() * 0.9 + 0.6;
        this.speedX = Math.random() * 0.8 - 0.2;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.025;
        this.tilt = Math.random() * Math.PI;
        this.tiltSpeed = Math.random() * 0.03 + 0.015;
        this.oscillationSpeed = Math.random() * 0.02 + 0.01;
        this.oscillationTimer = Math.random() * Math.PI * 2;
        this.opacity = Math.random() * 0.45 + 0.5;

        this.isLeaf = Math.random() < 0.2;
        if (this.isLeaf) {
          this.color = Math.random() < 0.5 ? 'rgba(112, 173, 126, ' : 'rgba(78, 142, 94, ';
        } else {
          const pinks = [
            'rgba(255, 183, 197, ',
            'rgba(255, 192, 203, ',
            'rgba(255, 218, 224, ',
            'rgba(255, 235, 240, '
          ];
          this.color = pinks[Math.floor(Math.random() * pinks.length)];
        }
      }

      update() {
        this.oscillationTimer += this.oscillationSpeed;
        this.tilt += this.tiltSpeed;
        this.rotation += this.rotationSpeed;

        this.y += this.speedY;
        this.x += this.speedX + Math.sin(this.oscillationTimer) * 0.6;

        if (this.y > height + 40 || this.x < -150 || this.x > width + 150) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.scale(Math.cos(this.tilt), 1);

        ctx.fillStyle = this.color + this.opacity + ')';
        ctx.beginPath();

        if (this.isLeaf) {
          ctx.moveTo(0, -this.size);
          ctx.quadraticCurveTo(this.size * 0.45, 0, 0, this.size);
          ctx.quadraticCurveTo(-this.size * 0.45, 0, 0, -this.size);
        } else {
          ctx.moveTo(0, -this.size * 0.8);
          ctx.bezierCurveTo(
            this.size * 0.6, -this.size * 0.4,
            this.size * 0.65, this.size * 0.7,
            0, this.size
          );
          ctx.bezierCurveTo(
            -this.size * 0.65, this.size * 0.7,
            -this.size * 0.6, -this.size * 0.4,
            0, -this.size * 0.8
          );
        }

        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < PETAL_COUNT; i++) {
      petals.push(new Petal());
    }

    // ===================== VAGA-LUMES =====================
    const FIREFLY_COUNT = 28;
    const fireflies = [];

    class Firefly {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 1.8;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.pulseSpeed = Math.random() * 0.03 + 0.015;
        this.pulseTimer = Math.random() * Math.PI * 2;
        this.baseAlpha = Math.random() * 0.4 + 0.5;
        this.isWarm = Math.random() < 0.75;
        this.colorRgb = this.isWarm ? '255, 230, 140' : '255, 190, 215';
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.pulseTimer += this.pulseSpeed;

        if (Math.random() < 0.02) {
          this.vx += (Math.random() - 0.5) * 0.2;
          this.vy += (Math.random() - 0.5) * 0.2;
          this.vx = Math.max(-0.7, Math.min(0.7, this.vx));
          this.vy = Math.max(-0.6, Math.min(0.6, this.vy));
        }

        if (this.x < -20) this.x = width + 20;
        if (this.x > width + 20) this.x = -20;
        if (this.y < -20) this.y = height + 20;
        if (this.y > height + 20) this.y = -20;
      }

      draw() {
        const alpha = (Math.sin(this.pulseTimer) * 0.45 + 0.55) * this.baseAlpha;
        if (alpha <= 0.02) return;

        const glowRadius = this.size * 6;

        const grad = ctx.createRadialGradient(
          this.x, this.y, 0,
          this.x, this.y, glowRadius
        );
        grad.addColorStop(0, `rgba(${this.colorRgb}, ${alpha})`);
        grad.addColorStop(0.3, `rgba(${this.colorRgb}, ${alpha * 0.5})`);
        grad.addColorStop(1, `rgba(${this.colorRgb}, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(this.x, this.y, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < FIREFLY_COUNT; i++) {
      fireflies.push(new Firefly());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < fireflies.length; i++) {
        fireflies[i].update();
        fireflies[i].draw();
      }

      for (let i = 0; i < petals.length; i++) {
        petals[i].update();
        petals[i].draw();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
